name: Publish

on:
  push:
    branches:
#      - main
#      - staging

env:
  IMAGE_NAME: ghcr.io/$(echo '${{ github.repository }}/${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]'):latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            -t ${{ env.IMAGE_NAME }} \
            -f ./WebApi/Dockerfile \
            .
